#####################################################################
# chordata.cfg - Chordata: belt tension from plucks, with the toolhead accelerometer
#
# Add to printer.cfg (install.sh does this):  [include chordata.cfg]
# Needs: [chordata] (the plugin), an accelerometer and [resonance_tester], [respond],
# and Mainsail or Fluidd for the prompts. Start it with the CHORDATA macro.
#
# Copyright (C) 2026  Chordata contributors
# This file may be distributed under the terms of the GNU GPLv3 license.
#####################################################################

[gcode_macro CHORDATA]
description: Chordata: measure and match the belt tension by plucking
gcode:
  {% if 'chordata' not in printer %}
    RESPOND TYPE=error MSG="Chordata: the plugin is not loaded: run install.sh and add [chordata] to printer.cfg"
  {% elif printer.print_stats.state in ['printing', 'paused'] %}
    RESPOND TYPE=error MSG="Chordata: the printer is busy, try again when it is done"
  {% else %}
    _CHORDATA_BELTS
  {% endif %}

[gcode_macro _CHORDATA_ST]
description: Chordata: Shake&Tune belt comparison graph
gcode:
  RESPOND TYPE=command MSG="action:prompt_end"
  RESPOND MSG="Chordata: running Shake&Tune's COMPARE_BELTS_RESPONSES; the graph lands in ShakeTune_results"
  COMPARE_BELTS_RESPONSES

[gcode_macro _CHORDATA_BELTS]
description: Chordata: belt tension steps
variable_target: 0
gcode:
  {% set pt = printer.chordata %}
  {% set step = params.STEP|default('setup')|lower %}
  {% set tgt = target if target > 0 else pt.belt_target %}
  {% if params.DT is defined or params.HZ is defined %}
    # a new target: typed on the page (HZ=, sent with any setup button) or -5..+5 in Mainsail's pop-up (DT=)
    {% set want = (params.HZ|float(tgt)) if params.HZ is defined else tgt + params.DT|float %}
    {% if want != want %}{% set want = tgt %}{% endif %}
    {% set tgt = [[want|round, 40]|max, 300]|min %}
    SET_GCODE_VARIABLE MACRO=_CHORDATA_BELTS VARIABLE=target VALUE={tgt}
  {% endif %}
  {% set xy = pt.tools.corexy %}
  RESPOND TYPE=command MSG="action:prompt_end"
  {% if not pt.tools.accel or not xy %}
    RESPOND TYPE=command MSG="action:prompt_begin Chordata - belt tension"
    {% if not xy %}
      RESPOND TYPE=command MSG="action:prompt_text The belt step is made for CoreXY printers, where both belts pull the toolhead and must match."
    {% else %}
      RESPOND TYPE=command MSG="action:prompt_text Chordata listens to the belts with an accelerometer on the toolhead (an ADXL345 or LIS2DW board, or a probe with one built in). None is set up: add one and [resonance_tester] to printer.cfg. How: Kalico docs, Measuring Resonances."
    {% endif %}
    RESPOND TYPE=command MSG="action:prompt_footer_button Close Chordata|_CHORDATA_CLOSE|secondary"
    RESPOND TYPE=command MSG="action:prompt_show"
  {% elif step == 'setup' %}
    _CHORDATA_SETUP
  {% elif step == 'go' %}
    _CHORDATA_POS GO=1
    _CHORDATA_SETUP
  {% elif step == 'save' %}
    _CHORDATA_POS SAVE=1
    _CHORDATA_SETUP
  {% elif step in ('start', 'tap') %}
    {% if step == 'start' %}
      # (no fan is turned off here: only fans the user allowed, from the hum card)
      _CHORDATA_START TARGET={tgt}
    {% endif %}
    RESPOND TYPE=command MSG="action:prompt_begin Chordata - tap the toolhead"
    RESPOND TYPE=command MSG="action:prompt_text Stand by: recording background noise"
    RESPOND TYPE=command MSG="action:prompt_footer_button Close Chordata|_CHORDATA_CLOSE|secondary"
    RESPOND TYPE=command MSG="action:prompt_show"
    _CHORDATA_TAP UI=1 ANYWAY={params.ANYWAY|default(0)|int}
    _CHORDATA_UI STEP=tapped
  {% elif step == 'free' %}
    RESPOND TYPE=command MSG="action:prompt_begin Chordata - Tuner Mode"
    RESPOND TYPE=command MSG="action:prompt_text Stand by"
    RESPOND TYPE=command MSG="action:prompt_footer_button Close Chordata|_CHORDATA_CLOSE|secondary"
    RESPOND TYPE=command MSG="action:prompt_show"
    _CHORDATA_FREE UI=1
    _CHORDATA_UI STEP=freedone
  {% endif %}

[gcode_macro _CHORDATA_SETUP]
description: Chordata: the setup prompt (its own macro, so _CHORDATA_BELTS can show it again after Go/Save without calling itself)
gcode:
  {% set pt = printer.chordata %}
  {% set var = printer["gcode_macro _CHORDATA_BELTS"].target %}
  {% set tgt = var if var > 0 else pt.belt_target %}
  {% set xy = pt.tools.corexy %}
  RESPOND TYPE=command MSG="action:prompt_end"
  {% set n = 5 %}
  # the instructions and specs are on the page's How it works; here only the controls
  RESPOND TYPE=command MSG="action:prompt_begin Set Target Frequency"
  RESPOND TYPE=command MSG="action:prompt_text Target Frequency: {'%.0f'|format(tgt)} Hz"
  {% set acc = pt.accel %}
  {% if acc %}
    RESPOND TYPE=command MSG="action:prompt_text Accelerometer: {acc.name}, frequency range {('%d-%d Hz'|format(acc.lo, acc.hi)) if acc.hi is not none else 'known after its first recording'}"
  {% endif %}
  {% set bad = acc and acc.hi is not none and tgt > acc.hi %}
  {% if bad %}
    RESPOND TYPE=command MSG="action:prompt_text Error: frequency target out of range"
  {% endif %}
  RESPOND TYPE=command MSG="action:prompt_button_group_start"
  RESPOND TYPE=command MSG="action:prompt_button -5 Hz|_CHORDATA_BELTS DT=-5|secondary"
  RESPOND TYPE=command MSG="action:prompt_button -1|_CHORDATA_BELTS DT=-1|secondary"
  RESPOND TYPE=command MSG="action:prompt_button +1|_CHORDATA_BELTS DT=1|secondary"
  RESPOND TYPE=command MSG="action:prompt_button +5 Hz|_CHORDATA_BELTS DT=5|secondary"
  RESPOND TYPE=command MSG="action:prompt_button_group_end"
  {% if pt.belt_pos %}
    RESPOND TYPE=command MSG="action:prompt_button Go to belt tensioning position|_CHORDATA_BELTS STEP=go|secondary"
  {% endif %}
  RESPOND TYPE=command MSG="action:prompt_button Save belt tensioning position|_CHORDATA_BELTS STEP=save|secondary"
  {% if not bad %}
    RESPOND TYPE=command MSG="action:prompt_button Start|_CHORDATA_BELTS STEP=start|primary"
  {% endif %}
  RESPOND TYPE=command MSG="action:prompt_footer_button Close Chordata|_CHORDATA_CLOSE|secondary"
  RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro _CHORDATA_UI]
description: Chordata: belt tension prompts
gcode:
  {% set pt = printer.chordata %}
  {% set step = params.STEP|default('ready')|lower %}
  {% set b = pt.belts %}
  RESPOND TYPE=command MSG="action:prompt_end"
  {% if step == 'tapnow' %}
    RESPOND TYPE=command MSG="action:prompt_begin Chordata - tap now"
    RESPOND TYPE=command MSG="action:prompt_text Tap the same solid spot on the toolhead lightly, one tap at a time, until 3 taps count. It stops by itself, or with Back or Close on the Chordata page. Homing and other commands, this Close Chordata too, wait until it stops."
    RESPOND TYPE=command MSG="action:prompt_footer_button Close Chordata|_CHORDATA_CLOSE|secondary"
    RESPOND TYPE=command MSG="action:prompt_show"
  {% elif step == 'tapped' and b.disturb %}
    # step 0: a steady line on the belt's note in the background: turn the fan off first
    {% set d = b.disturb %}
    RESPOND TYPE=command MSG="action:prompt_begin Chordata - something hums on the belt's note"
    RESPOND TYPE=command MSG="action:prompt_text Steady hum at {d.lines|map('round')|map('int')|join(' and ')} Hz, on or near the belt's note or twice it (target {'%.0f'|format(b.target)} Hz). A fan? Turn it off for a clean measurement. Fans Chordata turns off come back on when you close Chordata, when a print starts, or after 10 minutes without Chordata."
    {% for f in d.fans if not f.button and not f.ask and f.on %}
      RESPOND TYPE=command MSG="action:prompt_text {f.label[:1]|upper}{f.label[1:]} stays on: it {f.why}."
    {% endfor %}
    {% set ns = namespace(any=false) %}
    {% for f in d.fans %}
      {% if f.button and f.on %}
        {% set ns.any = true %}
        RESPOND TYPE=command MSG="action:prompt_button Turn off {f.label}|_CHORDATA_FANOFF INDEX={loop.index0}|primary"
      {% elif f.ask and f.on %}
        {% set ns.any = true %}
        RESPOND TYPE=command MSG="action:prompt_button Allow Chordata to turn off {f.label}|_CHORDATA_FANALLOW INDEX={loop.index0}|secondary"
      {% endif %}
    {% endfor %}
    {% if d.fans|selectattr('ask')|selectattr('on')|list %}
      RESPOND TYPE=command MSG="action:prompt_text Chordata only turns off fans you allow, and never one it recognises as cooling the hotend, the drivers or the electronics: check what a fan cools before you allow it. Your choice is kept."
    {% endif %}
    {% if not ns.any %}
      RESPOND TYPE=command MSG="action:prompt_text No fan that Chordata may turn off is running. Turn off whatever else runs, then measure again."
    {% elif d.fans|selectattr('kind', 'equalto', 'fan_generic')|selectattr('on')|list %}
      RESPOND TYPE=command MSG="action:prompt_text A fan that a macro or a template drives can come back on by itself: if the hum is still there, turn it off where it is driven."
    {% endif %}
    RESPOND TYPE=command MSG="action:prompt_button Listen again|_CHORDATA_BELTS STEP=tap|secondary"
    RESPOND TYPE=command MSG="action:prompt_button Measure anyway|_CHORDATA_BELTS STEP=tap ANYWAY=1|secondary"
    RESPOND TYPE=command MSG="action:prompt_footer_button Close Chordata|_CHORDATA_CLOSE|secondary"
    RESPOND TYPE=command MSG="action:prompt_show"
  {% elif step == 'tapped' %}
    RESPOND TYPE=command MSG="action:prompt_begin Chordata - tap the toolhead"
    {% if b.hum_note %}
      RESPOND TYPE=command MSG="action:prompt_text A steady hum at {b.hum_note|map('round')|map('int')|join(' and ')} Hz near the belt's note, from something Chordata can't turn off (the motors, a controller fan?). Measuring with it."
    {% endif %}
    {% if b.tap_done and b.tap_main %}
      RESPOND TYPE=command MSG="action:prompt_text {b.tap_good} good taps{(', %d did not count' % b.tap_bad) if b.tap_bad else ''}. Your toolhead rings at {'%.1f' % b.tap_main.freq} Hz{(' (also ' ~ (b.tap|reject('equalto', b.tap_main.freq)|map('round', 1)|join(', ')) ~ ' Hz)') if b.tap|length > 1 else ''}{(', ' ~ b.tap_range) if b.tap_range else ''}."
    {% elif b.tap_done %}
      RESPOND TYPE=command MSG="action:prompt_text Taps heard. The toolhead doesn't ring by itself near the belts: nothing to learn."
    {% elif b.tap_note and b.tap_note.startswith('steady hum') %}
      RESPOND TYPE=command MSG="action:prompt_text Taps not heard: a {b.tap_note} hides the toolhead's note (a fan?). Turn fans off, then press Measure Toolhead Frequency."
    {% elif b.tap_note == 'too many bad taps' %}
      RESPOND TYPE=command MSG="action:prompt_text {b.tap_bad} taps did not count. Something else may be shaking the printer: turn off fans and anything else that runs or vibrates, and check that the toolhead and its screws are tight. Then press Measure Toolhead Frequency."
    {% elif b.tap_note == 'taps on another spot' %}
      RESPOND TYPE=command MSG="action:prompt_text {b.tap_bad} taps did not count: most rang a different note than the first good tap. Pick one solid spot and tap only there, every time. Then press Measure Toolhead Frequency."
    {% elif b.tap_note == 'no tap heard' %}
      RESPOND TYPE=command MSG="action:prompt_text No tap heard. Tap a little firmer, on the same solid spot."
    {% else %}
      RESPOND TYPE=command MSG="action:prompt_text {b.tap_good or 0} of 3 taps counted. Tap the same solid spot lightly, one tap at a time, until 3 count."
    {% endif %}
    {% set acc = pt.accel %}
    {% if acc and acc.hi is not none and b.target > acc.hi %}
      RESPOND TYPE=command MSG="action:prompt_text Error: frequency target out of range"
      RESPOND TYPE=command MSG="action:prompt_text Accelerometer: {acc.name}, frequency range {acc.lo}-{acc.hi} Hz"
      RESPOND TYPE=command MSG="action:prompt_button Set Target Frequency|_CHORDATA_BELTS|primary"
    {% elif b.tap_done %}
      RESPOND TYPE=command MSG="action:prompt_button Tuner Mode|_CHORDATA_BELTS STEP=free|primary"
      RESPOND TYPE=command MSG="action:prompt_button Measure Toolhead Frequency|_CHORDATA_BELTS STEP=tap|secondary"
    {% else %}
      RESPOND TYPE=command MSG="action:prompt_button Measure Toolhead Frequency|_CHORDATA_BELTS STEP=tap|primary"
    {% endif %}
    RESPOND TYPE=command MSG="action:prompt_footer_button Stop|_CHORDATA_UI STEP=stop|secondary"
    RESPOND TYPE=command MSG="action:prompt_show"
  {% elif step == 'freepluck' %}
    RESPOND TYPE=command MSG="action:prompt_begin Chordata - Tuner Mode: pluck now"
    RESPOND TYPE=command MSG="action:prompt_text Pluck either belt. Turn a tensioner between plucks: every clear pluck shows up."
    RESPOND TYPE=command MSG="action:prompt_text It stops by itself {params.IDLE|default(60)} seconds after your last pluck, or press Done, Back or Close on the Chordata page. Homing and other commands, this Close Chordata too, wait until it stops."
    RESPOND TYPE=command MSG="action:prompt_footer_button Close Chordata|_CHORDATA_CLOSE|secondary"
    RESPOND TYPE=command MSG="action:prompt_show"
  {% elif step == 'freedone' %}
    {% set last = b.free.last if b and b.free else none %}
    RESPOND TYPE=command MSG="action:prompt_begin Chordata - Tuner Mode: {('%.1f Hz'|format(last)) if last is not none else 'no pluck heard'}"
    {% set hum = b.free.hum if b and b.free and b.free.hum else [] %}
    RESPOND TYPE=command MSG="action:prompt_text {('Last clear pluck %.1f Hz, target %.0f Hz.'|format(last, b.target)) if last is not none else (('Steady hum at %s Hz on the belt\'s note (a fan?): turn fans off, then measure again.'|format(hum|map('round')|map('int')|join(' and '))) if hum else 'No clear pluck heard. Pluck a little firmer.')}"
    {% if b and b.free and b.free.stopped == 'limit' %}
      RESPOND TYPE=command MSG="action:prompt_text Tuner Mode stopped after its longest listen ({b.free.max_min} minutes): press Tuner Mode to go on."
    {% endif %}
    RESPOND TYPE=command MSG="action:prompt_button Tuner Mode|_CHORDATA_BELTS STEP=free|primary"
    RESPOND TYPE=command MSG="action:prompt_footer_button Stop|_CHORDATA_UI STEP=stop|secondary"
    RESPOND TYPE=command MSG="action:prompt_show"
  {% elif step == 'stop' %}
    _CHORDATA_FANS
  {% endif %}

[gcode_macro _CHORDATA_FANOFF]
description: Chordata: turn a fan off (INDEX: its place in the fan list), let it stop, then take the background again
gcode:
  # (the fan first: if Chordata refuses it, the card with the buttons stays up)
  _CHORDATA_FAN INDEX={params.INDEX|default(-1)|int}
  RESPOND TYPE=command MSG="action:prompt_end"
  RESPOND TYPE=command MSG="action:prompt_begin Chordata - turning the fan off"
  RESPOND TYPE=command MSG="action:prompt_text Stand by: the fan is slowing down"
  RESPOND TYPE=command MSG="action:prompt_show"
  G4 P5000
  _CHORDATA_BELTS STEP=tap

[gcode_macro _CHORDATA_FANALLOW]
description: Chordata: allow Chordata to turn a fan off (INDEX: its place in the fan list), then show the card again
gcode:
  _CHORDATA_FAN_OK INDEX={params.INDEX|default(-1)|int} ALLOW=1
  _CHORDATA_UI STEP=tapped

[gcode_macro _CHORDATA_CLOSE]
description: Chordata: close, and turn back on the fans Chordata turned off
gcode:
  _CHORDATA_FANS
  RESPOND TYPE=command MSG="action:prompt_end"
